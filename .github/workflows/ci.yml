name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siteos
          POSTGRES_PASSWORD: siteos
          POSTGRES_DB: siteos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siteos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgres://siteos:siteos@localhost:5432/siteos
      CELERY_EAGER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Workflow engine tests (no database)
        run: python -m unittest apps.indents.tests.test_workflow apps.materials.tests.test_importer -v
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-but-long-enough-to-pass-the-deploy-check-1234567890
      - name: API tests
        shell: bash
        run: python manage.py test apps -v 2 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          # one annotation per failing test, with its traceback (visible in the run summary and the API)
          python - <<'PY'
          import re
          log = open("test.log").read()
          blocks = re.split(r"\n={50,}\n", log)
          for b in blocks[1:10]:
              msg = b.strip().replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:4000]
              print(f"::error title=Test failure::{msg}")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # real browser: production build of the React app + Django on a throw-away CI database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siteos
          POSTGRES_PASSWORD: siteos
          POSTGRES_DB: siteos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siteos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgres://siteos:siteos@localhost:5432/siteos
      CELERY_EAGER: "1"
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:4173
      LOGIN_RATE: 500/min        # many sign-ins from one IP during the browser run
      API_TARGET: http://127.0.0.1:8000   # Node resolves "localhost" to IPv6; runserver listens on IPv4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r backend/requirements.txt pytest pytest-playwright
          python -m playwright install --with-deps chromium
          cd frontend && npm install --no-audit --no-fund && npm run build
      - name: Start Django and the built app
        shell: bash
        run: |
          echo "E2E_PASSWORD=$(python -c 'import secrets;print(secrets.token_urlsafe(18))')" >> "$GITHUB_ENV"
          cd backend && python manage.py migrate --noinput
      - name: Test logins (CI database only)
        working-directory: backend
        run: |
          python manage.py shell < ../e2e/setup_users.py
          DEMO_PASSWORD="$E2E_PASSWORD" python manage.py seed_demo
      - name: Serve
        shell: bash
        run: |
          (cd backend && nohup python manage.py runserver 8000 > ../django.log 2>&1 &)
          (cd frontend && nohup npx vite preview --port 4173 --strictPort > ../vite.log 2>&1 &)
          for i in $(seq 1 40); do curl -sf http://localhost:4173/api/health/ && break; sleep 1; done
          curl -sf http://localhost:4173/api/health/
      - name: Browser tests
        shell: bash
        run: python -m pytest e2e -v --browser chromium 2>&1 | tee e2e.log; exit ${PIPESTATUS[0]}
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "PASSED|FAILED|ERROR" e2e.log > e2e-summary.log || true
          grep -E "^e2e/.*:[0-9]+|waiting for|Error:|intercepts pointer|assert " e2e.log | head -60 > e2e-where.log || true
          tail -c 5000 django.log > django-tail.log 2>/dev/null || echo "no django.log" > django-tail.log
          for f in e2e-summary.log e2e-where.log django-tail.log e2e.log vite.log; do
            [ -f $f ] || continue
            python - "$f" <<'PY'
          import sys
          t = open(sys.argv[1]).read()[-6000:]
          print("::error title=" + sys.argv[1] + "::" + (t or "(empty)").replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
          done
