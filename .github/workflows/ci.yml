name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siteos
          POSTGRES_PASSWORD: siteos
          POSTGRES_DB: siteos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siteos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgres://siteos:siteos@localhost:5432/siteos
      CELERY_EAGER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Workflow engine tests (no database)
        run: python -m unittest apps.indents.tests.test_workflow -v
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-but-long-enough-to-pass-the-deploy-check-1234567890
      - name: API tests
        run: python manage.py test apps -v 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
