# Local development:  cp .env.example .env  &&  docker compose up --build
#   frontend  http://localhost:5173      API docs  http://localhost:8000/api/docs/
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: siteos
      POSTGRES_PASSWORD: siteos
      POSTGRES_DB: siteos
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "siteos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://siteos:siteos@db:5432/siteos
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate --noinput && python manage.py seed && python manage.py runserver 0.0.0.0:8000"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://siteos:siteos@db:5432/siteos
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker -l info
    volumes: ["./backend:/app"]
    depends_on: [backend, redis]

  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://siteos:siteos@db:5432/siteos
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    volumes: ["./backend:/app"]
    depends_on: [backend, redis]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_TARGET: http://backend:8000
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]

  # ---------------------------------------------------------------- demo stack (separate database)
  # Only starts with:  DEMO_PASSWORD=choose-one docker compose --profile demo up -d
  #   app http://localhost:5174   API http://localhost:8001
  # Its own Postgres container + volume and its own uploads folder — the main database above is never touched.
  db-demo:
    image: postgres:16
    profiles: ["demo"]
    environment:
      POSTGRES_USER: siteos
      POSTGRES_PASSWORD: siteos
      POSTGRES_DB: siteos_demo
    volumes: [pgdata-demo:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "siteos", "-d", "siteos_demo"]
      interval: 5s
      retries: 10

  backend-demo:
    build: ./backend
    profiles: ["demo"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://siteos:siteos@db-demo:5432/siteos_demo
      MEDIA_ROOT: /app/media-demo
      CELERY_EAGER: "1"
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5174
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    command: sh -c "python manage.py migrate --noinput && python manage.py seed && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    volumes: ["./backend:/app"]
    ports: ["8001:8000"]
    depends_on:
      db-demo: {condition: service_healthy}

  frontend-demo:
    image: node:22-alpine
    profiles: ["demo"]
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      API_TARGET: http://backend-demo:8000
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5174:5174"]
    depends_on: [backend-demo]

volumes:
  pgdata:
  pgdata-demo:
